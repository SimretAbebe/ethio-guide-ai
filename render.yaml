services:
  # Backend FastAPI Service
  - type: web
    name: ethioguide-backend
    runtime: python
    rootDir: backend
    plan: free # Change to starter or higher for production
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_NAME
        value: ethio_guide
      - key: MONGODB_URI
        sync: false # Set this in the Render dashboard
      - key: GOOGLE_API_KEY
        sync: false # Set this in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173 # Change this to your frontend URL after deployment

  # Frontend Vite Service (Optional, can also use static site)
  - type: web
    name: ethioguide-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ethioguide-backend
          property: host
